[paths]
# Все пути указываются относительно корневого каталога work
data_dir = data
graphics_dir = graphics
output_dir = output
source_csv = data/ab_data.csv
binary_file = data/ab_data.pkl
groups_ref = data/groups.csv
pages_ref = data/pages.csv

[interface]
# Настройки графического интерфейса
window_title = Анализ результатов A/B-тестирования (CTR)
window_width = 1000
window_height = 650
font_family = Segoe UI
font_size = 10
table_rows = 100

[analysis]
# Уровень значимости для статистического теста (alpha)
alpha = 0.05
# Использовать поправку на непрерывность в Z-критерии (yes/no)
continuity_correction = no

[reports]
# Имена формируемых файлов отчётов
text_report = report.txt
bar_chart = ctr_bar.png
pie_chart = groups_pie.png
# Разрешение графиков (dpi)
chart_dpi = 120
